[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-agent"
version = "0.1.0"
description = "Stateless LLM-powered code context retrieval agent"
authors = [
  { name = "Code Context Agent Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "typer>=0.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff"
]
mcp = [
  "modelcontextprotocol"
]

[project.urls]
"Homepage" = "https://example.com/context-agent"

[project.scripts]
context-agent = "context_agent.cli:main"
